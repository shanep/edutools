[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
edutools = "edutools.cli:app"

[project]
name = "edutools"
version = "1.0.1"
description = "Command line tools for Canvas LMS: query courses and publish course content."
readme = "README.md"
authors = [
    { name = "Shane Panter", email = "shanepanter@boisestate.edu" }
]
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["education", "canvas", "canvas-lms", "lms", "edtech", "grading", "publishing"]
classifiers = [
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
	"requests==2.32.5",
	"typer>=0.9.0",
	"rich>=13.7,<15.0",
	"css-inline>=0.21.2",
]

[project.urls]
Homepage = "https://github.com/edutools/osslag"
Issues = "https://github.com/shanep/osslag/issues"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
