name: CI

# Checks run on every push and pull request. Installers are built only on demand
# (Actions > CI > Run workflow) or for a v* tag, and are uploaded as workflow
# artifacts. A pushed v* tag also publishes a GitHub release of those installers,
# once every check and both smoke tests pass, so pushing the tag is the release:
# it needs the owner's explicit go-ahead. Installers take their version from the
# tag they are built on, or from git describe past it; see scripts/version.cjs.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lint, typecheck and tests never start Electron, so skip its 100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  installer-mac:
    name: macOS installers
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: macos-latest
    steps:
      # Full history and tags: the version comes from git describe (scripts/version.cjs),
      # and a shallow clone has no tags to describe from.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Signing and notarization switch on when these secrets exist; with none set
      # the build is ad hoc signed. See packages/app/electron-builder.config.cjs.
      # A secret that is not set arrives as an empty string, and electron-builder
      # reads an empty CSC_LINK as a path to the working directory ("not a file"),
      # so each variable is exported only when its secret has a value.
      - name: Load signing credentials that are configured
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="$(printenv "SECRET_$name" || true)"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            fi
          done
      - name: Build .dmg for arm64 and x64
        working-directory: packages/app
        run: npm run dist:mac
        env:
          # Never look for a certificate in the runner's keychain: sign only with CSC_LINK.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: edutools-mac
          path: packages/app/release/*.dmg
          if-no-files-found: error
      - name: Smoke test the packaged app
        working-directory: packages/app
        run: ./release/mac-arm64/edutools.app/Contents/MacOS/edutools
        env:
          EDUTOOLS_SMOKE_TEST: "1"

  installer-windows:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    steps:
      # Full history and tags: the version comes from git describe (scripts/version.cjs),
      # and a shallow clone has no tags to describe from.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build NSIS installer for x64
        working-directory: packages/app
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: edutools-windows
          path: packages/app/release/*.exe
          if-no-files-found: error
      - name: Smoke test the packaged app
        working-directory: packages/app
        shell: pwsh
        run: |
          $env:EDUTOOLS_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "release\win-unpacked\edutools.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }

  release:
    name: GitHub release
    # Only a pushed tag: an on-demand build is for testing and never publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [installer-mac, installer-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: edutools-*
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The tag comes through the environment, never pasted into the script.
          TAG: ${{ github.ref_name }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          version="${TAG#v}"
          # Also attach each installer under a name with no version in it, so
          # releases/latest/download/<name> is a link that never changes (the README
          # uses these). GitHub's "latest" skips prereleases, so a beta never
          # replaces what those links serve.
          for name in mac-arm64.dmg mac-x64.dmg windows-x64-setup.exe; do
            cp "installers/edutools-${version}-${name}" "installers/edutools-${name}"
          done
          {
            echo "## Installers"
            echo
            echo "- macOS, Apple Silicon: \`edutools-${version}-mac-arm64.dmg\`"
            echo "- macOS, Intel: \`edutools-${version}-mac-x64.dmg\`"
            echo "- Windows x64: \`edutools-${version}-windows-x64-setup.exe\`"
            echo
            if [ "$MAC_SIGNED" != "true" ]; then
              echo "The macOS builds are not signed: approve the app under System Settings > Privacy & Security the first time it opens."
              echo
            fi
            if [ "$WIN_SIGNED" != "true" ]; then
              echo "The Windows build is not signed: choose \"More info\" then \"Run anyway\" in SmartScreen."
              echo
            fi
            echo "The CLI installs from source; see the README."
          } > notes.md
          # A tag with a prerelease part (v2.1.0-beta.1) is published as a prerelease.
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          # Re-running the workflow for a tag that already has a release replaces
          # its installers rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --verify-tag --title "edutools ${version}" \
              --notes-file notes.md --generate-notes $prerelease
          fi
